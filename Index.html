<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moonlight Designs - Stella</title>

<style>

/* ================================
   STELLA CONTAINER
================================ */

#stella-wrap {
    position: fixed;
    right: 20px;
    bottom: 15px;
    width: 260px;
    height: 300px;
    z-index: 999999;
    pointer-events: none;
}


/* ================================
   STELLA IMAGE
================================ */

#stella {
    position: absolute;
    right: 0;
    bottom: 0;

    width: 230px;
    max-width: 45vw;
    height: auto;

    cursor: pointer;
    pointer-events: auto;

    transform-origin: 50% 70%;

    filter:
        drop-shadow(0 8px 10px rgba(0,0,0,.25))
        drop-shadow(0 0 14px rgba(160,75,255,.55));

    animation:
        flyIn 3.2s cubic-bezier(.2,.8,.3,1) forwards,
        floatStella 3s ease-in-out 3.2s infinite;
}


/* ================================
   FLY INTO WEBSITE
================================ */

@keyframes flyIn {

    0% {
        transform:
            translate(-120vw,-45vh)
            rotate(-25deg)
            scale(.35);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    45% {
        transform:
            translate(-60vw,-25vh)
            rotate(12deg)
            scale(.65);
    }

    70% {
        transform:
            translate(-180px,-100px)
            rotate(-8deg)
            scale(.9);
    }

    88% {
        transform:
            translate(-25px,-30px)
            rotate(5deg)
            scale(1.08);
    }

    100% {
        transform:
            translate(0,0)
            rotate(0)
            scale(1);

        opacity: 1;
    }
}


/* ================================
   IDLE FLOAT
================================ */

@keyframes floatStella {

    0%,100% {
        transform:
            translateY(0)
            rotate(-2deg)
            scale(1);
    }

    50% {
        transform:
            translateY(-18px)
            rotate(2deg)
            scale(1.02);
    }
}


/* ================================
   CLICK DANCE
================================ */

#stella.dance {
    animation: stellaDance .9s ease !important;
}


@keyframes stellaDance {

    0% {
        transform:
            rotate(0)
            scale(1);
    }

    15% {
        transform:
            rotate(-12deg)
            scale(1.08);
    }

    30% {
        transform:
            rotate(12deg)
            scale(1.1);
    }

    45% {
        transform:
            translateY(-25px)
            rotate(-8deg)
            scale(1.08);
    }

    60% {
        transform:
            translateY(-5px)
            rotate(10deg)
            scale(1.1);
    }

    75% {
        transform:
            translateY(-18px)
            rotate(-5deg)
            scale(1.06);
    }

    100% {
        transform:
            translateY(0)
            rotate(0)
            scale(1);
    }
}


/* ================================
   SPEECH BUBBLE
================================ */

#stella-bubble {
    position: absolute;

    right: 165px;
    bottom: 215px;

    width: 240px;

    padding: 16px 18px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f7eaff
        );

    border: 3px solid #9b52df;
    border-radius: 24px;

    color: #31145c;

    font-family:
        Arial,
        sans-serif;

    font-size: 16px;
    font-weight: 800;

    text-align: center;
    line-height: 1.35;

    box-shadow:
        0 8px 25px rgba(0,0,0,.22),
        0 0 20px rgba(167,80,255,.35);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.75);

    transition:
        .35s ease;

    pointer-events: none;
}


#stella-bubble.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* Speech bubble arrow */

#stella-bubble::after {
    content: "";

    position: absolute;

    right: 25px;
    bottom: -15px;

    width: 25px;
    height: 25px;

    background: #f7eaff;

    border-right: 3px solid #9b52df;
    border-bottom: 3px solid #9b52df;

    transform: rotate(45deg);
}


/* ================================
   SPARKLES
================================ */

.stella-sparkle {
    position: absolute;

    font-size: 20px;

    pointer-events: none;

    animation:
        sparkleMagic 1.8s ease-out forwards;
}


@keyframes sparkleMagic {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.2)
            rotate(0);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-120px)
            scale(1.4)
            rotate(180deg);
    }
}


/* ================================
   LITTLE HEARTS
================================ */

.stella-heart {
    position: fixed;

    pointer-events: none;

    z-index: 9999999;

    font-size: 22px;

    animation:
        heartFly 1.7s ease-out forwards;
}


@keyframes heartFly {

    0% {
        opacity: 1;

        transform:
            translateY(0)
            scale(.5);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-130px)
            scale(1.5)
            rotate(20deg);
    }
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    #stella-wrap {
        width: 170px;
        height: 210px;

        right: 5px;
        bottom: 5px;
    }


    #stella {
        width: 155px;
        max-width: 42vw;
    }


    #stella-bubble {
        width: 180px;

        right: 105px;
        bottom: 145px;

        padding: 12px;

        font-size: 13px;
    }

}


/* Accessibility */

@media(prefers-reduced-motion:reduce) {

    #stella {
        animation: none;
    }

}

</style>
</head>


<body>


<!-- ===============================
     STELLA
================================ -->

<div id="stella-wrap">

    <div id="stella-bubble">
        <span id="stella-text">
            Welcome to Moonlight Designs! ✨
        </span>
    </div>


    <img
        src="stella.png"
        id="stella"
        alt="Stella the Moonlight Designs owl"
    >

</div>



<script>

/* ===============================
   STELLA JAVASCRIPT
================================ */

const stella =
    document.getElementById("stella");

const stellaWrap =
    document.getElementById("stella-wrap");

const bubble =
    document.getElementById("stella-bubble");

const stellaText =
    document.getElementById("stella-text");


/* ===============================
   STELLA'S SAYINGS
================================ */

const messages = [

    "Welcome to Moonlight Designs! ✨",

    "Hey beautiful! I'm Stella! 🦉💜",

    "Come see what's new! 🌙",

    "Psst... the shop is calling you! 👀",

    "Let's make something magical! ✨",

    "Have you seen the newest designs? 💜",

    "You're looking fabulous today! ⭐",

    "Go ahead... treat yourself! 😂💜",

    "Need clipart? I know a place! 🦉",

    "Moonlight magic is happening! 🌙✨"

];


let currentMessage = 0;

let bubbleTimer;


/* ===============================
   STELLA TALKS
================================ */

function stellaTalk() {

    stellaText.textContent =
        messages[currentMessage];


    currentMessage++;

    if(currentMessage >= messages.length) {
        currentMessage = 0;
    }


    bubble.classList.add("show");


    clearTimeout(bubbleTimer);


    bubbleTimer =
        setTimeout(function() {

            bubble.classList.remove("show");

        }, 5000);

}


/* ===============================
   SPARKLES
================================ */

function makeSparkles(amount = 12) {

    const symbols = [
        "✨",
        "⭐",
        "🌙",
        "💜",
        "✦"
    ];


    for(let i = 0; i < amount; i++) {

        const sparkle =
            document.createElement("span");


        sparkle.className =
            "stella-sparkle";


        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        sparkle.style.left =
            (
                20 +
                Math.random() * 200
            ) + "px";


        sparkle.style.top =
            (
                50 +
                Math.random() * 180
            ) + "px";


        sparkle.style.animationDelay =
            (
                Math.random() * .5
            ) + "s";


        stellaWrap.appendChild(
            sparkle
        );


        setTimeout(function() {

            sparkle.remove();

        }, 2400);

    }

}


/* ===============================
   HEART EXPLOSION
================================ */

function makeHearts() {

    const rect =
        stella.getBoundingClientRect();


    for(let i = 0; i < 7; i++) {

        const heart =
            document.createElement("span");


        heart.className =
            "stella-heart";


        heart.textContent =
            Math.random() > .5
            ? "💜"
            : "✨";


        heart.style.left =
            (
                rect.left +
                rect.width / 2 +
                Math.random() * 80 -
                40
            ) + "px";


        heart.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";


        heart.style.animationDelay =
            (
                Math.random() * .25
            ) + "s";


        document.body.appendChild(
            heart
        );


        setTimeout(function() {

            heart.remove();

        }, 2200);

    }

}


/* ===============================
   CLICK STELLA
================================ */

stella.addEventListener(
    "click",
    function() {

        /* restart dance */

        stella.classList.remove(
            "dance"
        );


        void stella.offsetWidth;


        stella.classList.add(
            "dance"
        );


        stellaTalk();

        makeSparkles(16);

        makeHearts();


        /* return to floating */

        setTimeout(function() {

            stella.classList.remove(
                "dance"
            );

            stella.style.animation =
                "floatStella 3s ease-in-out infinite";

        }, 950);

    }
);


/* ===============================
   FIRST WELCOME
================================ */

setTimeout(function() {

    stellaTalk();

    makeSparkles(18);

}, 3400);


/* ===============================
   RANDOM MAGIC
================================ */

setInterval(function() {

    makeSparkles(5);

}, 7000);


/* ===============================
   STELLA RANDOMLY TALKS
================================ */

setInterval(function() {

    stellaTalk();

}, 22000);


</script>

</body>
</html>
