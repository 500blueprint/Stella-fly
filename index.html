<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stella - Moonlight Designs</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* STELLA CONTAINER */

#stella-container {
    position: fixed;
    right: 15px;
    bottom: 10px;
    width: 300px;
    height: 350px;
    z-index: 999999;
}

/* STELLA */

#stella {
    position: absolute;
    right: 0;
    bottom: 0;

    width: 260px;
    height: auto;

    display: block;

    cursor: pointer;

    opacity: 1;

    filter:
        drop-shadow(0 6px 10px rgba(0,0,0,.25))
        drop-shadow(0 0 12px rgba(151,75,255,.55));

    animation: floatStella 3s ease-in-out infinite;
}

@keyframes floatStella {

    0%, 100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-18px) rotate(2deg);
    }
}

/* SPEECH BUBBLE */

#stella-bubble {
    position: absolute;

    right: 175px;
    bottom: 235px;

    width: 220px;

    padding: 15px;

    box-sizing: border-box;

    background: white;

    color: #35155d;

    border: 3px solid #9254de;

    border-radius: 22px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;

    text-align: center;

    box-shadow:
        0 6px 20px rgba(0,0,0,.2),
        0 0 15px rgba(151,75,255,.3);

    opacity: 0;

    transform: scale(.7);

    transition:
        opacity .3s ease,
        transform .3s ease;

    z-index: 10;
}

#stella-bubble.show {
    opacity: 1;
    transform: scale(1);
}

/* SPARKLES */

.sparkle {
    position: fixed;

    pointer-events: none;

    font-size: 24px;

    z-index: 9999999;

    animation: sparkleMove 1.4s ease-out forwards;
}

@keyframes sparkleMove {

    0% {
        opacity: 1;
        transform: translateY(0) scale(.3);
    }

    100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.3);
    }
}

/* MOBILE */

@media (max-width: 600px) {

    #stella-container {
        width: 190px;
        height: 240px;
        right: 5px;
        bottom: 5px;
    }

    #stella {
        width: 170px;
    }

    #stella-bubble {
        width: 180px;
        right: 110px;
        bottom: 160px;
        font-size: 13px;
    }
}

</style>
</head>

<body>

<div id="stella-container">

    <div id="stella-bubble">
        <span id="stella-text">
            Welcome to Moonlight Designs! ✨
        </span>
    </div>

    <img
        id="stella"
        src="https://500blueprint.github.io/Stella-fly/Stella.PNG"
        alt="Stella"
    >

</div>


<script>

const stella =
    document.getElementById("stella");

const bubble =
    document.getElementById("stella-bubble");

const stellaText =
    document.getElementById("stella-text");


const messages = [

    "Welcome to Moonlight Designs! ✨",

    "Hi! I'm Stella! 🦉💜",

    "Come see what's new! 🌙",

    "Let's make something magical! ✨",

    "Psst... check out the shop! 👀",

    "New designs are waiting for you! 💫",

    "Thanks for visiting Moonlight Designs! 💜"

];


let messageIndex = 0;


/* TALK */

function talk() {

    stellaText.textContent =
        messages[messageIndex];

    messageIndex =
        (messageIndex + 1)
        % messages.length;

    bubble.classList.add("show");

    setTimeout(function() {

        bubble.classList.remove("show");

    }, 4500);
}


/* SPARKLES */

function sparkles() {

    const icons = [
        "✨",
        "⭐",
        "💜",
        "🌙"
    ];

    const rect =
        stella.getBoundingClientRect();


    for(let i = 0; i < 10; i++) {

        const sparkle =
            document.createElement("span");

        sparkle.className =
            "sparkle";

        sparkle.textContent =
            icons[
                Math.floor(
                    Math.random()
                    * icons.length
                )
            ];

        sparkle.style.left =
            (
                rect.left +
                Math.random() *
                rect.width
            ) + "px";

        sparkle.style.top =
            (
                rect.top +
                Math.random() *
                rect.height
            ) + "px";

        document.body.appendChild(
            sparkle
        );

        setTimeout(function() {

            sparkle.remove();

        }, 1500);
    }
}


/* CLICK STELLA */

stella.addEventListener(
    "click",
    function() {

        talk();

        sparkles();

    }
);


/* FIRST WELCOME */

window.addEventListener(
    "load",
    function() {

        setTimeout(function() {

            talk();

            sparkles();

        }, 1000);

    }
);

</script>

</body>
</html>
