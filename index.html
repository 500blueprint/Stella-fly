<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stella | Moonlight Designs</title>

<style>

/* ==========================================
   PAGE
========================================== */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;
}


/* ==========================================
   STELLA AREA
========================================== */

#stella-area {

    position: fixed;

    right: 20px;
    bottom: 15px;

    width: 280px;
    height: 330px;

    z-index: 999999;

    pointer-events: none;
}


/* ==========================================
   STELLA
========================================== */

#stella {

    position: absolute;

    right: 0;
    bottom: 0;

    width: 240px;
    height: auto;

    max-width: none;

    pointer-events: auto;

    cursor: pointer;

    user-select: none;

    -webkit-user-drag: none;

    opacity: 0;

    filter:
        drop-shadow(0 8px 12px rgba(0,0,0,.25))
        drop-shadow(0 0 12px rgba(152,72,255,.55));

    animation:
        stellaFlyIn 3.2s cubic-bezier(.2,.8,.3,1) forwards,
        stellaFloat 3.4s ease-in-out 3.2s infinite;
}


/* ==========================================
   FLY INTO SCREEN
========================================== */

@keyframes stellaFlyIn {

    0% {

        opacity: 0;

        transform:
            translate(-120vw,-40vh)
            rotate(-25deg)
            scale(.3);

    }

    15% {

        opacity: 1;

    }

    40% {

        transform:
            translate(-60vw,-20vh)
            rotate(15deg)
            scale(.55);

    }

    65% {

        transform:
            translate(-180px,-100px)
            rotate(-8deg)
            scale(.85);

    }

    82% {

        transform:
            translate(-40px,-35px)
            rotate(6deg)
            scale(1.08);

    }

    92% {

        transform:
            translate(5px,-12px)
            rotate(-3deg)
            scale(.97);

    }

    100% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(1);

    }

}


/* ==========================================
   FLOAT AFTER LANDING
========================================== */

@keyframes stellaFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateY(-18px)
            rotate(2deg);

    }

}


/* ==========================================
   CLICK WIGGLE
========================================== */

#stella.wiggle {

    animation:
        stellaWiggle .7s ease,
        stellaFloat 3.4s ease-in-out .7s infinite;

    opacity: 1;
}


@keyframes stellaWiggle {

    0% {

        transform:
            rotate(0)
            scale(1);

    }

    20% {

        transform:
            rotate(-12deg)
            scale(1.08);

    }

    40% {

        transform:
            rotate(12deg)
            scale(1.1);

    }

    60% {

        transform:
            rotate(-8deg)
            scale(1.06);

    }

    80% {

        transform:
            rotate(7deg)
            scale(1.03);

    }

    100% {

        transform:
            rotate(0)
            scale(1);

    }

}


/* ==========================================
   SPEECH BUBBLE
========================================== */

#stella-bubble {

    position: absolute;

    right: 150px;
    bottom: 220px;

    width: 240px;

    padding: 16px 18px;

    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f7edff
        );

    color: #321558;

    border:
        3px solid #9557e8;

    border-radius: 24px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 16px;

    font-weight: 800;

    line-height: 1.35;

    text-align: center;

    box-shadow:
        0 8px 24px rgba(0,0,0,.22),
        0 0 18px rgba(151,70,255,.35);

    opacity: 0;

    transform:
        translateY(15px)
        scale(.7);

    transition:
        opacity .35s ease,
        transform .35s ease;

    pointer-events: none;

}


/* SHOW BUBBLE */

#stella-bubble.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


/* SPEECH BUBBLE TAIL */

#stella-bubble::after {

    content: "";

    position: absolute;

    right: 28px;
    bottom: -15px;

    width: 26px;
    height: 26px;

    background: #f7edff;

    border-right:
        3px solid #9557e8;

    border-bottom:
        3px solid #9557e8;

    transform:
        rotate(45deg);

}


/* ==========================================
   SPARKLES
========================================== */

.sparkle {

    position: fixed;

    z-index: 9999999;

    pointer-events: none;

    font-size: 22px;

    animation:
        sparkleUp 1.7s ease-out forwards;

}


@keyframes sparkleUp {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.2)
            rotate(0deg);

    }

    20% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translateY(-110px)
            scale(1.4)
            rotate(180deg);

    }

}


/* ==========================================
   HEART BURST
========================================== */

.heart {

    position: fixed;

    z-index: 9999999;

    pointer-events: none;

    font-size: 25px;

    animation:
        heartBurst 1.5s ease-out forwards;

}


@keyframes heartBurst {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(.4);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--moveX),
                -120px
            )
            scale(1.4);

    }

}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    #stella-area {

        width: 180px;
        height: 225px;

        right: 5px;
        bottom: 5px;

    }


    #stella {

        width: 160px;

    }


    #stella-bubble {

        width: 190px;

        right: 105px;
        bottom: 150px;

        padding: 13px;

        font-size: 13px;

    }

}


/* ==========================================
   REDUCED MOTION
========================================== */

@media (prefers-reduced-motion: reduce) {

    #stella {

        opacity: 1;

        animation: none;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     STELLA
========================================== -->

<div id="stella-area">


    <!-- SPEECH BUBBLE -->

    <div id="stella-bubble">

        <span id="stella-message">

            Welcome to Moonlight Designs! ✨

        </span>

    </div>


    <!-- STELLA IMAGE -->

    <img
        id="stella"
        src="https://500blueprint.github.io/Stella-fly/Stella.PNG"
        alt="Stella - Moonlight Designs"
    >


</div>



<script>

(function () {


/* ==========================================
   GET ELEMENTS
========================================== */

const stella =
    document.getElementById("stella");


const bubble =
    document.getElementById("stella-bubble");


const message =
    document.getElementById("stella-message");


let bubbleTimer;


/* ==========================================
   STELLA'S MESSAGES
========================================== */

const messages = [

    "Welcome to Moonlight Designs! ✨",

    "Hi! I'm Stella! 🦉💜",

    "Come see what's new! 🌙",

    "Psst... have you checked the shop? 👀",

    "Let's make something magical! ✨",

    "New designs are waiting for you! 💫",

    "Don't forget to check the newest drops! ⭐",

    "Need some clipart? I know a place! 😉",

    "You deserve something pretty today! 💜",

    "Thanks for visiting Moonlight Designs! 🌙"

];


let messageNumber = 0;


/* ==========================================
   STELLA TALKS
========================================== */

function stellaTalk() {


    message.textContent =
        messages[messageNumber];


    messageNumber++;


    if (
        messageNumber >=
        messages.length
    ) {

        messageNumber = 0;

    }


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(function () {

            bubble.classList.remove(
                "show"
            );

        }, 5000);

}


/* ==========================================
   MAKE SPARKLES
========================================== */

function makeSparkles(amount) {


    const symbols = [

        "✨",
        "⭐",
        "💜",
        "🌙",
        "✦"

    ];


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const sparkle =
            document.createElement(
                "span"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random()
                    * symbols.length
                )
            ];


        sparkle.style.left =
            (
                rect.left
                +
                Math.random()
                * rect.width
            )
            + "px";


        sparkle.style.top =
            (
                rect.top
                +
                Math.random()
                * rect.height
            )
            + "px";


        sparkle.style.animationDelay =
            (
                Math.random()
                * .4
            )
            + "s";


        document.body.appendChild(
            sparkle
        );


        setTimeout(function () {

            sparkle.remove();

        }, 2200);

    }

}


/* ==========================================
   HEARTS
========================================== */

function makeHearts() {


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < 6;
        i++
    ) {


        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "heart";


        heart.textContent =
            Math.random() > .5
            ? "💜"
            : "✨";


        heart.style.left =
            (
                rect.left
                +
                rect.width / 2
            )
            + "px";


        heart.style.top =
            (
                rect.top
                +
                rect.height / 2
            )
            + "px";


        heart.style.setProperty(

            "--moveX",

            (
                Math.random()
                * 160
                - 80
            )
            + "px"

        );


        heart.style.animationDelay =
            (
                Math.random()
                * .25
            )
            + "s";


        document.body.appendChild(
            heart
        );


        setTimeout(function () {

            heart.remove();

        }, 1900);

    }

}


/* ==========================================
   CLICK STELLA
========================================== */

stella.addEventListener(
    "click",
    function () {


        /* Reset wiggle */

        stella.classList.remove(
            "wiggle"
        );


        void stella.offsetWidth;


        /* Wiggle */

        stella.classList.add(
            "wiggle"
        );


        /* Talk */

        stellaTalk();


        /* Magic */

        makeSparkles(14);

        makeHearts();

    }
);


/* ==========================================
   IMAGE LOADED
========================================== */

stella.addEventListener(
    "load",
    function () {


        console.log(
            "Stella loaded successfully!"
        );


        /* Wait until fly-in finishes */

        setTimeout(function () {

            stellaTalk();

            makeSparkles(12);

        }, 3400);

    }
);


/* ==========================================
   IMAGE ERROR
========================================== */

stella.addEventListener(
    "error",
    function () {


        console.error(
            "Stella.PNG could not load."
        );


        console.error(
            "Expected URL:"
        );


        console.error(
            "https://500blueprint.github.io/Stella-fly/Stella.PNG"
        );

    }
);


/* ==========================================
   RANDOM IDLE SPARKLES
========================================== */

setInterval(function () {


    if (
        stella.complete
        &&
        stella.naturalWidth > 0
    ) {

        makeSparkles(5);

    }


}, 9000);


/* ==========================================
   OCCASIONAL STELLA MESSAGE
========================================== */

setInterval(function () {


    if (
        !bubble.classList.contains(
            "show"
        )
    ) {

        stellaTalk();

    }


}, 30000);


})();

</script>


</body>
</html>
