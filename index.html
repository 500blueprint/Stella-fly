<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Momma's Bewitched Creations</title>


<style>

/* =========================================
   COMPLETE RESET
========================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  overflow-x: hidden;

  background: transparent;
}


/* =========================================
   VIDEO CONTAINER
========================================= */

.video-container {

  position: relative;

  width: 100%;

  margin: 0;
  padding: 0;

  background: transparent;

  overflow: hidden;

  line-height: 0;

}


/* =========================================
   VIDEO

   IMPORTANT:
   NO fixed height
   NO 100vh
   NO aspect ratio
   NO giant black container
========================================= */

#mainVideo {

  display: block;

  width: 100%;
  max-width: 100%;

  height: auto;

  margin: 0;
  padding: 0;

  border: 0;

  object-fit: contain;

  background: transparent;

}


/* =========================================
   FALLING STAR OVERLAY
========================================= */

#starLayer {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  pointer-events: none;

  z-index: 999999;

}


/* =========================================
   INDIVIDUAL STAR
========================================= */

.magic-star {

  position: absolute;

  top: -50px;

  display: block;

  color: #fff8a8;

  opacity: 0;

  line-height: 1;

  text-shadow:

    0 0 3px #ffffff,

    0 0 7px #fffbd0,

    0 0 12px #fff09a,

    0 0 20px #ffe66d,

    0 0 30px #ffd84d;


  animation-name:
    starFall,
    starTwinkle;

  animation-timing-function:
    linear,
    ease-in-out;

  animation-iteration-count:
    infinite,
    infinite;

}


/* =========================================
   FALLING ANIMATION
========================================= */

@keyframes starFall {

  0% {

    transform:
      translateY(-80px)
      rotate(0deg)
      scale(.6);

    opacity: 0;

  }


  8% {

    opacity: .9;

  }


  50% {

    opacity: 1;

  }


  88% {

    opacity: .9;

  }


  100% {

    transform:
      translateY(115vh)
      rotate(360deg)
      scale(1.1);

    opacity: 0;

  }

}


/* =========================================
   TWINKLE
========================================= */

@keyframes starTwinkle {

  0% {

    filter:
      brightness(.8);

  }


  100% {

    filter:
      brightness(1.8);

  }

}


/* =========================================
   MOBILE
========================================= */

@media screen and (max-width: 768px) {

  html,
  body {

    width: 100%;

  }


  .video-container {

    width: 100%;

    height: auto;

  }


  #mainVideo {

    width: 100%;

    height: auto;

    max-height: none;

    object-fit: contain;

  }

}


/* =========================================
   SMALL PHONES
========================================= */

@media screen and (max-width: 480px) {

  #mainVideo {

    width: 100%;

    height: auto;

  }

}

</style>

</head>



<body>


<!-- =====================================
     MOMMA'S BEWITCHED VIDEO
===================================== -->

<div class="video-container">


  <video

    id="mainVideo"

    autoplay

    muted

    loop

    playsinline

    webkit-playsinline

    preload="auto"

    disablepictureinpicture

  >


    <!--
       IMPORTANT:

       Your GitHub screenshot shows:

       index.MP4

       CAPITAL MP4
    -->


    <source
      src="./index.MP4"
      type="video/mp4"
    >


    Your browser does not support HTML5 video.


  </video>


</div>



<!-- =====================================
     MAGICAL FALLING STARS
===================================== -->

<div id="starLayer"></div>



<script>


/* =====================================
   VIDEO SETUP
===================================== */


const video =
  document.getElementById(
    "mainVideo"
  );


/* Force muted autoplay */

video.muted = true;

video.defaultMuted = true;


video.setAttribute(
  "muted",
  ""
);


video.setAttribute(
  "playsinline",
  ""
);


video.setAttribute(
  "webkit-playsinline",
  ""
);



/* =====================================
   PLAY VIDEO
===================================== */


function startVideo() {


  const playAttempt =
    video.play();


  if (
    playAttempt !== undefined
  ) {


    playAttempt.catch(
      function () {


        video.muted = true;


        video.play().catch(
          function () {

            /* Safari may wait
               for interaction */

          }
        );


      }
    );


  }


}



/* Try when HTML loads */

document.addEventListener(

  "DOMContentLoaded",

  startVideo

);



/* Try again when everything loads */

window.addEventListener(

  "load",

  startVideo

);



/* =====================================
   iPHONE / SAFARI BACKUP
===================================== */


document.addEventListener(

  "touchstart",

  function () {


    if (
      video.paused
    ) {

      startVideo();

    }


  },

  {
    once: true,
    passive: true
  }

);



/* =====================================
   FALLING STARS
===================================== */


const starLayer =
  document.getElementById(
    "starLayer"
  );



const starShapes = [

  "✦",

  "✧",

  "⋆",

  "★",

  "✦",

  "✧"

];



/* Number of stars */

const STAR_COUNT = 30;



for (
  let i = 0;
  i < STAR_COUNT;
  i++
) {


  const star =
    document.createElement(
      "span"
    );


  star.className =
    "magic-star";



  /* =================================
     RANDOM STAR SHAPE
  ================================= */


  star.textContent =

    starShapes[

      Math.floor(

        Math.random() *

        starShapes.length

      )

    ];



  /* =================================
     RANDOM HORIZONTAL POSITION
  ================================= */


  star.style.left =

    Math.random() *

    100 +

    "vw";



  /* =================================
     RANDOM SIZE
  ================================= */


  const size =

    8 +

    Math.random() *

    17;


  star.style.fontSize =

    size +

    "px";



  /* =================================
     RANDOM FALL SPEED
  ================================= */


  const fallSpeed =

    7 +

    Math.random() *

    9;



  const twinkleSpeed =

    1 +

    Math.random() *

    2;



  star.style.animationDuration =

    fallSpeed +

    "s, " +

    twinkleSpeed +

    "s";



  /* =================================
     RANDOM STARTING TIMES
  ================================= */


  const fallDelay =

    -Math.random() *

    15;



  const twinkleDelay =

    -Math.random() *

    3;



  star.style.animationDelay =

    fallDelay +

    "s, " +

    twinkleDelay +

    "s";



  /* Add star */

  starLayer.appendChild(
    star
  );


}


</script>


</body>

</html>
