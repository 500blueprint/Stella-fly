<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stella - Moonlight Designs</title>

<style>

/* =====================================================
   PAGE
===================================================== */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}


/* =====================================================
   STELLA CONTAINER
===================================================== */

#stella-container {

    position: fixed;

    right: 15px;
    bottom: 10px;

    width: 300px;
    height: 350px;

    z-index: 999999;

    pointer-events: none;
}


/* =====================================================
   STELLA
===================================================== */

#stella {

    position: absolute;

    right: 0;
    bottom: 0;

    width: 260px;
    height: auto;

    max-width: none;

    display: block;

    cursor: pointer;

    pointer-events: auto;

    user-select: none;

    -webkit-user-drag: none;

    opacity: 0;

    filter:
        drop-shadow(
            0 6px 10px
            rgba(0,0,0,.25)
        )
        drop-shadow(
            0 0 12px
            rgba(151,75,255,.55)
        );

    animation:
        stellaFlyIn
        3.5s
        cubic-bezier(.22,.8,.3,1)
        forwards,

        floatStella
        3s
        ease-in-out
        3.5s
        infinite;
}


/* =====================================================
   STELLA FLYS INTO SCREEN
===================================================== */

@keyframes stellaFlyIn {

    0% {

        opacity: 0;

        transform:
            translate(-110vw,-35vh)
            rotate(-20deg)
            scale(.35);

    }


    10% {

        opacity: 1;

    }


    30% {

        transform:
            translate(-75vw,-18vh)
            rotate(12deg)
            scale(.55);

    }


    50% {

        transform:
            translate(-45vw,-30vh)
            rotate(-8deg)
            scale(.7);

    }


    70% {

        transform:
            translate(-220px,-100px)
            rotate(10deg)
            scale(.88);

    }


    85% {

        transform:
            translate(-60px,-40px)
            rotate(-5deg)
            scale(1.05);

    }


    93% {

        transform:
            translate(8px,-12px)
            rotate(3deg)
            scale(.97);

    }


    100% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(1);

    }

}


/* =====================================================
   FLOAT AFTER LANDING
===================================================== */

@keyframes floatStella {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-2deg);

    }


    50% {

        transform:
            translateY(-18px)
            rotate(2deg);

    }

}


/* =====================================================
   CLICK BOUNCE
===================================================== */

#stella.clicked {

    animation:
        stellaClick
        .65s
        ease,

        floatStella
        3s
        ease-in-out
        .65s
        infinite;

    opacity: 1;
}


@keyframes stellaClick {

    0% {

        transform:
            scale(1)
            rotate(0);

    }


    20% {

        transform:
            scale(1.1)
            rotate(-8deg);

    }


    40% {

        transform:
            scale(1.12)
            rotate(8deg);

    }


    60% {

        transform:
            scale(1.08)
            rotate(-5deg);

    }


    80% {

        transform:
            scale(1.04)
            rotate(4deg);

    }


    100% {

        transform:
            scale(1)
            rotate(0);

    }

}


/* =====================================================
   SPEECH BUBBLE
===================================================== */

#stella-bubble {

    position: absolute;

    right: 175px;
    bottom: 235px;

    width: 220px;

    padding: 15px;

    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8efff
        );

    color: #35155d;

    border:
        3px solid
        #9254de;

    border-radius: 22px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.35;

    text-align: center;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.20),

        0 0 15px
        rgba(151,75,255,.30);

    opacity: 0;

    transform:
        translateY(10px)
        scale(.7);

    transition:
        opacity .3s ease,
        transform .3s ease;

    z-index: 10;

    pointer-events: none;
}


/* SHOW SPEECH BUBBLE */

#stella-bubble.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


/* =====================================================
   SPEECH BUBBLE TAIL
===================================================== */

#stella-bubble::after {

    content: "";

    position: absolute;

    right: 25px;
    bottom: -14px;

    width: 24px;
    height: 24px;

    background: #f8efff;

    border-right:
        3px solid
        #9254de;

    border-bottom:
        3px solid
        #9254de;

    transform:
        rotate(45deg);

}


/* =====================================================
   SPARKLES
===================================================== */

.sparkle {

    position: fixed;

    pointer-events: none;

    z-index: 9999999;

    font-size: 24px;

    animation:
        sparkleMove
        1.5s
        ease-out
        forwards;
}


@keyframes sparkleMove {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.25)
            rotate(0deg);

    }


    20% {

        opacity: 1;

    }


    100% {

        opacity: 0;

        transform:
            translateY(-110px)
            scale(1.35)
            rotate(180deg);

    }

}


/* =====================================================
   HEARTS
===================================================== */

.stella-heart {

    position: fixed;

    pointer-events: none;

    z-index: 9999999;

    font-size: 25px;

    animation:
        heartFly
        1.6s
        ease-out
        forwards;
}


@keyframes heartFly {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(.4);

    }


    100% {

        opacity: 0;

        transform:
            translate(
                var(--heartX),
                -130px
            )
            scale(1.4);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #stella-container {

        width: 190px;
        height: 240px;

        right: 5px;
        bottom: 5px;

    }


    #stella {

        width: 170px;

    }


    #stella-bubble {

        width: 180px;

        right: 110px;
        bottom: 160px;

        padding: 12px;

        font-size: 13px;

    }

}


/* =====================================================
   ACCESSIBILITY
===================================================== */

@media (
    prefers-reduced-motion:
    reduce
) {

    #stella {

        opacity: 1;

        animation: none;

    }

}

</style>

</head>


<body>


<!-- ===================================================
     STELLA
=================================================== -->

<div id="stella-container">


    <!-- SPEECH BUBBLE -->

    <div id="stella-bubble">

        <span id="stella-text">

            Welcome to Moonlight Designs! ✨

        </span>

    </div>


    <!-- STELLA IMAGE -->

    <img

        id="stella"

        src="https://500blueprint.github.io/Stella-fly/Stella.PNG"

        alt="Stella - Moonlight Designs Mascot"

    >


</div>



<script>

/* =====================================================
   STELLA JAVASCRIPT
===================================================== */

(function () {


/* =====================================================
   ELEMENTS
===================================================== */

const stella =
    document.getElementById(
        "stella"
    );


const bubble =
    document.getElementById(
        "stella-bubble"
    );


const stellaText =
    document.getElementById(
        "stella-text"
    );


let bubbleTimer;


/* =====================================================
   STELLA MESSAGES
===================================================== */

const messages = [

    "Welcome to Moonlight Designs! ✨",

    "Hi! I'm Stella! 🦉💜",

    "Come see what's new! 🌙",

    "Let's make something magical! ✨",

    "Psst... have you checked the shop? 👀",

    "New designs are waiting for you! 💫",

    "Don't forget to check the newest drops! ⭐",

    "Need some clipart? I know a place! 😉",

    "You deserve something pretty today! 💜",

    "Thanks for visiting Moonlight Designs! 🌙"

];


let messageIndex = 0;


/* =====================================================
   TALK
===================================================== */

function talk() {


    stellaText.textContent =
        messages[
            messageIndex
        ];


    messageIndex =
        (
            messageIndex + 1
        )
        %
        messages.length;


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(
            function () {

                bubble.classList.remove(
                    "show"
                );

            },

            4500
        );

}


/* =====================================================
   SPARKLES
===================================================== */

function makeSparkles(
    amount
) {


    const icons = [

        "✨",

        "⭐",

        "💜",

        "🌙",

        "✦"

    ];


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const sparkle =
            document.createElement(
                "span"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            icons[
                Math.floor(
                    Math.random()
                    *
                    icons.length
                )
            ];


        sparkle.style.left =
            (
                rect.left
                +
                Math.random()
                *
                rect.width
            )
            +
            "px";


        sparkle.style.top =
            (
                rect.top
                +
                Math.random()
                *
                rect.height
            )
            +
            "px";


        sparkle.style.animationDelay =
            (
                Math.random()
                *
                .35
            )
            +
            "s";


        document.body.appendChild(
            sparkle
        );


        setTimeout(
            function () {

                sparkle.remove();

            },

            2000
        );

    }

}


/* =====================================================
   HEART BURST
===================================================== */

function makeHearts() {


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < 5;
        i++
    ) {


        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "stella-heart";


        heart.textContent =
            "💜";


        heart.style.left =
            (
                rect.left
                +
                rect.width / 2
            )
            +
            "px";


        heart.style.top =
            (
                rect.top
                +
                rect.height / 2
            )
            +
            "px";


        heart.style.setProperty(

            "--heartX",

            (
                Math.random()
                *
                140
                -
                70
            )
            +
            "px"

        );


        document.body.appendChild(
            heart
        );


        setTimeout(
            function () {

                heart.remove();

            },

            1800
        );

    }

}


/* =====================================================
   CLICK STELLA
===================================================== */

stella.addEventListener(
    "click",
    function () {


        /* Restart click animation */

        stella.classList.remove(
            "clicked"
        );


        void stella.offsetWidth;


        stella.classList.add(
            "clicked"
        );


        /* Stella talks */

        talk();


        /* Magic effects */

        makeSparkles(
            12
        );


        makeHearts();

    }
);


/* =====================================================
   FIRST WELCOME
===================================================== */

window.addEventListener(
    "load",
    function () {


        /*
           Stella flies for 3.5 seconds.

           Wait until she lands before
           showing the welcome message.
        */


        setTimeout(
            function () {


                talk();


                makeSparkles(
                    12
                );


            },

            3900
        );

    }
);


/* =====================================================
   IDLE SPARKLES
===================================================== */

setInterval(
    function () {


        if (
            stella.complete
            &&
            stella.naturalWidth
            >
            0
        ) {


            makeSparkles(
                4
            );

        }


    },

    9000
);


/* =====================================================
   IMAGE ERROR CHECK
===================================================== */

stella.addEventListener(
    "error",
    function () {


        console.error(
            "Stella image failed to load."
        );


        console.error(
            "Expected image:"
        );


        console.error(
            "https://500blueprint.github.io/Stella-fly/Stella.PNG"
        );

    }
);


})();

</script>


</body>

</html>
