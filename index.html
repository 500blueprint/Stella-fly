<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moonlight Designs — Stella</title>

<style>

/* =========================================
   PAGE — DO NOT BLOCK PAYHIP SCROLLING
========================================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    overflow-x: hidden;
}


/* =========================================
   MAGICAL SKY LAYER
========================================= */

#magic-sky {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    pointer-events: none;

    z-index: 99990;
}


/* =========================================
   FALLING MOONS
========================================= */

.falling-moon {
    position: absolute;
    top: -80px;

    width: var(--size);
    height: var(--size);

    border-radius: 50%;

    border-right:
        calc(var(--size) * .18)
        solid #fff7c7;

    filter:
        drop-shadow(0 0 5px #ffffff)
        drop-shadow(0 0 12px #e5c8ff)
        drop-shadow(0 0 22px #9c68ff);

    opacity: 0;

    animation:
        moonFall
        var(--speed)
        linear
        forwards;
}


@keyframes moonFall {

    0% {
        opacity: 0;

        transform:
            translate3d(0,-80px,0)
            rotate(-15deg);
    }

    10% {
        opacity: .95;
    }

    30% {
        transform:
            translate3d(25px,30vh,0)
            rotate(5deg);
    }

    60% {
        transform:
            translate3d(-25px,65vh,0)
            rotate(-10deg);
    }

    100% {
        opacity: .15;

        transform:
            translate3d(35px,115vh,0)
            rotate(10deg);
    }
}


/* =========================================
   FALLING STARS
========================================= */

.falling-star {
    position: absolute;
    top: -50px;

    width: var(--size);
    height: var(--size);

    pointer-events: none;

    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 10px #fff4b0)
        drop-shadow(0 0 18px #b984ff);

    animation:
        starFall
        var(--speed)
        linear
        forwards;
}


/* Make an actual star shape */

.falling-star::before {
    content: "✦";

    position: absolute;

    color: #fffbe7;

    font-size: var(--size);

    line-height: 1;

    animation:
        starPulse
        .75s
        ease-in-out
        infinite alternate;
}


@keyframes starFall {

    0% {
        opacity: 0;

        transform:
            translate3d(0,-60px,0)
            rotate(0deg);
    }

    8% {
        opacity: 1;
    }

    35% {
        transform:
            translate3d(30px,35vh,0)
            rotate(120deg);
    }

    65% {
        transform:
            translate3d(-25px,70vh,0)
            rotate(250deg);
    }

    100% {
        opacity: 0;

        transform:
            translate3d(40px,115vh,0)
            rotate(420deg);
    }
}


@keyframes starPulse {

    from {
        opacity: .45;

        transform:
            scale(.65);
    }

    to {
        opacity: 1;

        transform:
            scale(1.35);
    }
}


/* =========================================
   TWINKLING STARS AROUND SCREEN
========================================= */

.twinkle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    border-radius: 50%;

    background: white;

    pointer-events: none;

    box-shadow:
        0 0 4px #ffffff,
        0 0 8px #ffffff,
        0 0 15px #cba7ff,
        0 0 24px #9d62ff;

    animation:
        twinkleBright
        var(--twinkle-speed)
        ease-in-out
        forwards;
}


/* little cross rays */

.twinkle::before,
.twinkle::after {
    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    background:
        rgba(255,255,255,.95);

    transform:
        translate(-50%,-50%);
}


.twinkle::before {
    width: calc(var(--size) * 4);
    height: 1px;
}


.twinkle::after {
    width: 1px;
    height: calc(var(--size) * 4);
}


@keyframes twinkleBright {

    0% {
        opacity: 0;

        transform:
            scale(.1)
            rotate(0deg);
    }

    30% {
        opacity: 1;

        transform:
            scale(1.5)
            rotate(45deg);
    }

    55% {
        opacity: .35;

        transform:
            scale(.7)
            rotate(90deg);
    }

    75% {
        opacity: 1;

        transform:
            scale(1.25)
            rotate(135deg);
    }

    100% {
        opacity: 0;

        transform:
            scale(.1)
            rotate(180deg);
    }
}


/* =========================================
   SHOOTING STARS
========================================= */

.shooting-star {
    position: absolute;

    width: 100px;
    height: 2px;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            #ffffff
        );

    border-radius: 100%;

    filter:
        drop-shadow(0 0 6px #ffffff)
        drop-shadow(0 0 12px #ad76ff);

    transform:
        rotate(-25deg);

    animation:
        shootingStar
        1.4s
        ease-out
        forwards;
}


.shooting-star::after {
    content: "";

    position: absolute;

    right: -3px;
    top: -3px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #c89cff;
}


@keyframes shootingStar {

    0% {
        opacity: 0;

        transform:
            translate(-100px,-100px)
            rotate(-25deg);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(450px,280px)
            rotate(-25deg);
    }
}


/* =========================================
   STELLA CONTAINER
========================================= */

#stella-container {
    position: fixed;

    right: 15px;
    bottom: 10px;

    width: 300px;
    height: 350px;

    z-index: 999999;

    pointer-events: none;
}


/* =========================================
   STELLA
========================================= */

#stella {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 260px;
    height: auto;

    display: block;

    cursor: pointer;

    pointer-events: auto;

    user-select: none;
    -webkit-user-drag: none;

    opacity: 0;

    filter:
        drop-shadow(
            0 6px 10px
            rgba(0,0,0,.25)
        )

        drop-shadow(
            0 0 14px
            rgba(151,75,255,.65)
        );

    animation:
        stellaFlyIn
        3.5s
        cubic-bezier(.22,.8,.3,1)
        forwards,

        floatStella
        3s
        ease-in-out
        3.5s
        infinite;
}


/* =========================================
   ORIGINAL STELLA FLY-IN
========================================= */

@keyframes stellaFlyIn {

    0% {
        opacity: 0;

        transform:
            translate(-110vw,-35vh)
            rotate(-20deg)
            scale(.35);
    }

    10% {
        opacity: 1;
    }

    30% {
        transform:
            translate(-75vw,-18vh)
            rotate(12deg)
            scale(.55);
    }

    50% {
        transform:
            translate(-45vw,-30vh)
            rotate(-8deg)
            scale(.7);
    }

    70% {
        transform:
            translate(-220px,-100px)
            rotate(10deg)
            scale(.88);
    }

    85% {
        transform:
            translate(-60px,-40px)
            rotate(-5deg)
            scale(1.05);
    }

    93% {
        transform:
            translate(8px,-12px)
            rotate(3deg)
            scale(.97);
    }

    100% {
        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(1);
    }
}


/* =========================================
   STELLA FLOAT
========================================= */

@keyframes floatStella {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-18px)
            rotate(2deg);
    }
}


/* =========================================
   STELLA CLICK
========================================= */

#stella.clicked {
    opacity: 1;

    animation:
        stellaClick
        .65s
        ease,

        floatStella
        3s
        ease-in-out
        .65s
        infinite;
}


@keyframes stellaClick {

    0% {
        transform:
            scale(1)
            rotate(0);
    }

    25% {
        transform:
            scale(1.1)
            rotate(-8deg);
    }

    50% {
        transform:
            scale(1.12)
            rotate(8deg);
    }

    75% {
        transform:
            scale(1.06)
            rotate(-4deg);
    }

    100% {
        transform:
            scale(1)
            rotate(0);
    }
}


/* =========================================
   STELLA SPEECH BUBBLE
========================================= */

#stella-bubble {
    position: absolute;

    right: 175px;
    bottom: 235px;

    width: 220px;

    padding: 15px;

    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8efff
        );

    color: #35155d;

    border:
        3px solid
        #9254de;

    border-radius: 22px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: bold;

    text-align: center;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.20),

        0 0 18px
        rgba(151,75,255,.4);

    opacity: 0;

    transform:
        translateY(10px)
        scale(.7);

    transition:
        opacity .3s ease,
        transform .3s ease;

    pointer-events: none;
}


#stella-bubble.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================
   STELLA CLICK MAGIC
========================================= */

.stella-magic {
    position: fixed;

    z-index: 9999999;

    pointer-events: none;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px white,
        0 0 15px #d9b5ff,
        0 0 25px #9b5cff;

    animation:
        stellaMagic
        1.5s
        ease-out
        forwards;
}


@keyframes stellaMagic {

    0% {
        opacity: 1;

        transform:
            translate(0,0)
            scale(.5);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.7);
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    #stella-container {
        width: 190px;
        height: 240px;

        right: 5px;
        bottom: 5px;
    }

    #stella {
        width: 170px;
    }

    #stella-bubble {
        width: 175px;

        right: 105px;
        bottom: 160px;

        font-size: 12px;
    }

}

</style>
</head>


<body>


<!-- MAGIC EFFECTS -->

<div id="magic-sky"></div>


<!-- STELLA -->

<div id="stella-container">

    <div id="stella-bubble">

        <span id="stella-text">
            Welcome to Moonlight Designs! ✨
        </span>

    </div>


    <img
        id="stella"
        src="https://500blueprint.github.io/Stella-fly/Stella.PNG"
        alt="Stella"
    >

</div>



<script>

(function () {


/* =========================================
   ELEMENTS
========================================= */

const sky =
    document.getElementById("magic-sky");

const stella =
    document.getElementById("stella");

const bubble =
    document.getElementById("stella-bubble");

const text =
    document.getElementById("stella-text");


let bubbleTimer;


/* =========================================
   STELLA MESSAGES
========================================= */

const messages = [

    "Welcome to Moonlight Designs! ✨",

    "Hi! I'm Stella! 🦉💜",

    "Follow the moonlight! 🌙",

    "Let's make something magical! ✨",

    "Psst... check out the shop! 👀",

    "The stars brought you here! ⭐",

    "New designs are waiting! 💫",

    "Thanks for visiting Moonlight Designs! 💜"

];


let messageIndex = 0;


/* =========================================
   STELLA TALK
========================================= */

function talk() {

    text.textContent =
        messages[messageIndex];


    messageIndex =
        (messageIndex + 1)
        %
        messages.length;


    bubble.classList.add("show");


    clearTimeout(bubbleTimer);


    bubbleTimer =
        setTimeout(
            function () {

                bubble.classList.remove(
                    "show"
                );

            },
            4200
        );
}


/* =========================================
   CREATE FALLING STAR
========================================= */

function createStar() {

    const star =
        document.createElement("span");


    star.className =
        "falling-star";


    star.style.left =
        Math.random() * 100 + "vw";


    star.style.setProperty(
        "--size",
        (
            10 +
            Math.random() * 17
        ) + "px"
    );


    const speed =
        6 +
        Math.random() * 7;


    star.style.setProperty(
        "--speed",
        speed + "s"
    );


    sky.appendChild(star);


    setTimeout(
        function () {

            star.remove();

        },
        speed * 1000
    );
}


/* =========================================
   CREATE FALLING MOON
========================================= */

function createMoon() {

    const moon =
        document.createElement("span");


    moon.className =
        "falling-moon";


    moon.style.left =
        Math.random() * 100 + "vw";


    moon.style.setProperty(
        "--size",
        (
            15 +
            Math.random() * 17
        ) + "px"
    );


    const speed =
        9 +
        Math.random() * 7;


    moon.style.setProperty(
        "--speed",
        speed + "s"
    );


    sky.appendChild(moon);


    setTimeout(
        function () {

            moon.remove();

        },
        speed * 1000
    );
}


/* =========================================
   CREATE TWINKLE
========================================= */

function createTwinkle() {

    const sparkle =
        document.createElement("span");


    sparkle.className =
        "twinkle";


    sparkle.style.left =
        Math.random() * 100 + "vw";


    sparkle.style.top =
        Math.random() * 100 + "vh";


    sparkle.style.setProperty(
        "--size",
        (
            2 +
            Math.random() * 4
        ) + "px"
    );


    sparkle.style.setProperty(
        "--twinkle-speed",
        (
            1.3 +
            Math.random() * 1.8
        ) + "s"
    );


    sky.appendChild(sparkle);


    setTimeout(
        function () {

            sparkle.remove();

        },
        3500
    );
}


/* =========================================
   SHOOTING STAR
========================================= */

function createShootingStar() {

    const star =
        document.createElement("span");


    star.className =
        "shooting-star";


    star.style.left =
        (
            Math.random() * 60
        ) + "vw";


    star.style.top =
        (
            Math.random() * 40
        ) + "vh";


    sky.appendChild(star);


    setTimeout(
        function () {

            star.remove();

        },
        1700
    );
}


/* =========================================
   STELLA MAGIC BURST
========================================= */

function stellaBurst() {

    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const sparkle =
            document.createElement("span");


        sparkle.className =
            "stella-magic";


        sparkle.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";


        sparkle.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";


        sparkle.style.setProperty(
            "--x",
            (
                Math.random() * 260 -
                130
            ) + "px"
        );


        sparkle.style.setProperty(
            "--y",
            (
                Math.random() * 240 -
                150
            ) + "px"
        );


        document.body.appendChild(
            sparkle
        );


        setTimeout(
            function () {

                sparkle.remove();

            },
            1700
        );
    }
}


/* =========================================
   CLICK STELLA
========================================= */

stella.addEventListener(
    "click",
    function () {

        stella.classList.remove(
            "clicked"
        );


        void stella.offsetWidth;


        stella.classList.add(
            "clicked"
        );


        talk();

        stellaBurst();

    }
);


/* =========================================
   STELLA ARRIVES
========================================= */

window.addEventListener(
    "load",
    function () {

        setTimeout(
            function () {

                talk();

                stellaBurst();

            },
            3900
        );

    }
);


/* =========================================
   CONTINUOUS MAGIC
========================================= */

/* lots of falling stars */

setInterval(
    createStar,
    500
);


/* moons are less frequent */

setInterval(
    createMoon,
    1700
);


/* bright random twinkles */

setInterval(
    createTwinkle,
    350
);


/* occasional shooting star */

setInterval(
    createShootingStar,
    6500
);


/* =========================================
   PUT MAGIC ON SCREEN IMMEDIATELY
========================================= */

for (
    let i = 0;
    i < 18;
    i++
) {

    setTimeout(
        createTwinkle,
        i * 90
    );

}


for (
    let i = 0;
    i < 8;
    i++
) {

    setTimeout(
        createStar,
        i * 180
    );

}


for (
    let i = 0;
    i < 3;
    i++
) {

    setTimeout(
        createMoon,
        i * 700
    );

}


})();

</script>

</body>
</html>
