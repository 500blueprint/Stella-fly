<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stella Fall | Moonlight Designs</title>

<style>

/* =====================================================
   PAGE
===================================================== */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}


/* =====================================================
   FALL LEAF LAYER
===================================================== */

#fall-leaves {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;

    z-index: 9000;
}


.fall-leaf {
    position: absolute;

    top: -70px;

    pointer-events: none;

    user-select: none;

    opacity: .9;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(0,0,0,.18)
        );

    animation:
        leafFall
        linear
        forwards;
}


/* =====================================================
   FALLING LEAF MOVEMENT
===================================================== */

@keyframes leafFall {

    0% {
        opacity: 0;

        transform:
            translate3d(0,-10vh,0)
            rotate(0deg);
    }


    8% {
        opacity: .95;
    }


    25% {
        transform:
            translate3d(
                var(--sway1),
                25vh,
                0
            )
            rotate(110deg);
    }


    50% {
        transform:
            translate3d(
                var(--sway2),
                55vh,
                0
            )
            rotate(230deg);
    }


    75% {
        transform:
            translate3d(
                var(--sway3),
                82vh,
                0
            )
            rotate(350deg);
    }


    100% {
        opacity: .15;

        transform:
            translate3d(
                var(--sway4),
                115vh,
                0
            )
            rotate(520deg);
    }

}


/* =====================================================
   STELLA CONTAINER
===================================================== */

#stella-container {

    position: fixed;

    right: 15px;
    bottom: 10px;

    width: 300px;
    height: 350px;

    z-index: 999999;

    pointer-events: none;
}


/* =====================================================
   STELLA
===================================================== */

#stella {

    position: absolute;

    right: 0;
    bottom: 0;

    width: 260px;
    height: auto;

    max-width: none;

    display: block;

    cursor: pointer;

    pointer-events: auto;

    user-select: none;

    -webkit-user-drag: none;

    opacity: 0;

    filter:
        drop-shadow(
            0 7px 10px
            rgba(0,0,0,.28)
        )

        drop-shadow(
            0 0 13px
            rgba(151,75,255,.55)
        );

    animation:

        stellaFlyIn
        3.5s
        cubic-bezier(.22,.8,.3,1)
        forwards,

        floatStella
        3s
        ease-in-out
        3.5s
        infinite;
}


/* =====================================================
   STELLA FLY-IN
===================================================== */

@keyframes stellaFlyIn {

    0% {

        opacity: 0;

        transform:
            translate(-110vw,-35vh)
            rotate(-20deg)
            scale(.35);
    }


    10% {

        opacity: 1;

    }


    30% {

        transform:
            translate(-75vw,-18vh)
            rotate(12deg)
            scale(.55);

    }


    50% {

        transform:
            translate(-45vw,-30vh)
            rotate(-8deg)
            scale(.7);

    }


    70% {

        transform:
            translate(-220px,-100px)
            rotate(10deg)
            scale(.88);

    }


    85% {

        transform:
            translate(-60px,-40px)
            rotate(-5deg)
            scale(1.05);

    }


    93% {

        transform:
            translate(8px,-12px)
            rotate(3deg)
            scale(.97);

    }


    100% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);

    }

}


/* =====================================================
   FLOATING STELLA
===================================================== */

@keyframes floatStella {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-2deg);

    }


    50% {

        transform:
            translateY(-18px)
            rotate(2deg);

    }

}


/* =====================================================
   STELLA CLICK REACTION
===================================================== */

#stella.clicked {

    opacity: 1;

    animation:

        stellaClick
        .65s
        ease,

        floatStella
        3s
        ease-in-out
        .65s
        infinite;
}


@keyframes stellaClick {

    0% {

        transform:
            scale(1)
            rotate(0);

    }


    20% {

        transform:
            scale(1.1)
            rotate(-8deg);

    }


    40% {

        transform:
            scale(1.12)
            rotate(8deg);

    }


    60% {

        transform:
            scale(1.08)
            rotate(-5deg);

    }


    80% {

        transform:
            scale(1.04)
            rotate(4deg);

    }


    100% {

        transform:
            scale(1)
            rotate(0);

    }

}


/* =====================================================
   SPEECH BUBBLE
===================================================== */

#stella-bubble {

    position: absolute;

    right: 175px;
    bottom: 235px;

    width: 225px;

    padding: 15px;

    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #fffdf7,
            #f7edff
        );

    color: #35155d;

    border:
        3px solid
        #9254de;

    border-radius: 22px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;

    font-weight: 800;

    line-height: 1.35;

    text-align: center;

    box-shadow:

        0 6px 20px
        rgba(0,0,0,.20),

        0 0 15px
        rgba(151,75,255,.30);

    opacity: 0;

    transform:
        translateY(10px)
        scale(.7);

    transition:
        opacity .3s ease,
        transform .3s ease;

    z-index: 10;

    pointer-events: none;
}


#stella-bubble.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


/* SPEECH BUBBLE TAIL */

#stella-bubble::after {

    content: "";

    position: absolute;

    right: 25px;
    bottom: -14px;

    width: 24px;
    height: 24px;

    background: #f7edff;

    border-right:
        3px solid
        #9254de;

    border-bottom:
        3px solid
        #9254de;

    transform:
        rotate(45deg);
}


/* =====================================================
   MAGIC SPARKLES
===================================================== */

.sparkle {

    position: fixed;

    pointer-events: none;

    z-index: 9999999;

    font-size: 24px;

    animation:
        sparkleMove
        1.5s
        ease-out
        forwards;
}


@keyframes sparkleMove {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.25)
            rotate(0deg);

    }


    20% {

        opacity: 1;

    }


    100% {

        opacity: 0;

        transform:
            translateY(-110px)
            scale(1.35)
            rotate(180deg);

    }

}


/* =====================================================
   HEART EFFECT
===================================================== */

.stella-heart {

    position: fixed;

    pointer-events: none;

    z-index: 9999999;

    font-size: 25px;

    animation:
        heartFly
        1.6s
        ease-out
        forwards;
}


@keyframes heartFly {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(.4);

    }


    100% {

        opacity: 0;

        transform:
            translate(
                var(--heartX),
                -130px
            )
            scale(1.4);

    }

}


/* =====================================================
   FALL BURST
===================================================== */

.leaf-burst {

    position: fixed;

    z-index: 9999999;

    pointer-events: none;

    font-size: 25px;

    animation:
        leafBurst
        1.8s
        ease-out
        forwards;
}


@keyframes leafBurst {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(.3);

    }


    100% {

        opacity: 0;

        transform:
            translate(
                var(--burstX),
                var(--burstY)
            )
            rotate(
                var(--burstRotate)
            )
            scale(1.25);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #stella-container {

        width: 190px;
        height: 240px;

        right: 5px;
        bottom: 5px;

    }


    #stella {

        width: 170px;

    }


    #stella-bubble {

        width: 180px;

        right: 110px;
        bottom: 160px;

        padding: 12px;

        font-size: 13px;

    }


    .fall-leaf {

        opacity: .75;

    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (
    prefers-reduced-motion:
    reduce
) {

    #stella {

        opacity: 1;

        animation: none;

    }


    #fall-leaves {

        display: none;

    }

}

</style>

</head>


<body>


<!-- ===================================================
     FALLING LEAVES
=================================================== -->

<div id="fall-leaves"></div>


<!-- ===================================================
     STELLA
=================================================== -->

<div id="stella-container">


    <div id="stella-bubble">

        <span id="stella-text">

            Welcome to Moonlight Designs! 🍂✨

        </span>

    </div>


    <img

        id="stella"

        src="https://500blueprint.github.io/Stella-fly/Stella.PNG"

        alt="Stella - Moonlight Designs Mascot"

    >


</div>



<script>

(function () {


/* =====================================================
   ELEMENTS
===================================================== */

const stella =
    document.getElementById(
        "stella"
    );


const bubble =
    document.getElementById(
        "stella-bubble"
    );


const stellaText =
    document.getElementById(
        "stella-text"
    );


const fallContainer =
    document.getElementById(
        "fall-leaves"
    );


let bubbleTimer;


/* =====================================================
   FALL STELLA SAYINGS
===================================================== */

const messages = [

    "Welcome to Moonlight Designs! 🍂✨",

    "Hi! I'm Stella! 🦉💜",

    "Fall into something magical! 🍁",

    "Cozy season has arrived! 🍂",

    "Come see what's new! 🌙",

    "Sweater weather & new designs! ☕🍁",

    "Psst... have you checked the shop? 👀",

    "Let's make some autumn magic! ✨🍂",

    "New designs are falling into the shop! 🍁",

    "Pumpkin season makes everything better! 🎃",

    "You deserve something pretty today! 💜",

    "Thanks for visiting Moonlight Designs! 🌙🍂"

];


let messageIndex = 0;


/* =====================================================
   TALK
===================================================== */

function talk() {


    stellaText.textContent =
        messages[
            messageIndex
        ];


    messageIndex =
        (
            messageIndex + 1
        )
        %
        messages.length;


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(
            function () {

                bubble.classList.remove(
                    "show"
                );

            },

            4500
        );

}


/* =====================================================
   CREATE FALLING LEAF
===================================================== */

function createFallLeaf() {


    const leafSymbols = [

        "🍂",
        "🍁",
        "🍃"

    ];


    const leaf =
        document.createElement(
            "span"
        );


    leaf.className =
        "fall-leaf";


    leaf.textContent =
        leafSymbols[
            Math.floor(
                Math.random()
                *
                leafSymbols.length
            )
        ];


    /* Horizontal starting position */

    leaf.style.left =
        (
            Math.random()
            *
            100
        )
        +
        "vw";


    /* Random size */

    leaf.style.fontSize =
        (
            14
            +
            Math.random()
            *
            26
        )
        +
        "px";


    /* Random fall speed */

    const fallTime =
        7
        +
        Math.random()
        *
        8;


    leaf.style.animationDuration =
        fallTime
        +
        "s";


    /* Random swaying */

    leaf.style.setProperty(

        "--sway1",

        (
            Math.random()
            *
            100
            -
            50
        )
        +
        "px"

    );


    leaf.style.setProperty(

        "--sway2",

        (
            Math.random()
            *
            150
            -
            75
        )
        +
        "px"

    );


    leaf.style.setProperty(

        "--sway3",

        (
            Math.random()
            *
            120
            -
            60
        )
        +
        "px"

    );


    leaf.style.setProperty(

        "--sway4",

        (
            Math.random()
            *
            180
            -
            90
        )
        +
        "px"

    );


    fallContainer.appendChild(
        leaf
    );


    /* Remove after animation */

    setTimeout(
        function () {

            leaf.remove();

        },

        fallTime
        *
        1000
    );

}


/* =====================================================
   CONTINUOUS FALLING LEAVES
===================================================== */

setInterval(
    createFallLeaf,
    550
);


/* Start with leaves already falling */

for (
    let i = 0;
    i < 10;
    i++
) {

    setTimeout(
        createFallLeaf,
        i * 180
    );

}


/* =====================================================
   STELLA SPARKLES
===================================================== */

function makeSparkles(
    amount
) {


    const icons = [

        "✨",
        "⭐",
        "💜",
        "🌙",
        "✦",
        "🍂"

    ];


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const sparkle =
            document.createElement(
                "span"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            icons[
                Math.floor(
                    Math.random()
                    *
                    icons.length
                )
            ];


        sparkle.style.left =
            (
                rect.left
                +
                Math.random()
                *
                rect.width
            )
            +
            "px";


        sparkle.style.top =
            (
                rect.top
                +
                Math.random()
                *
                rect.height
            )
            +
            "px";


        sparkle.style.animationDelay =
            (
                Math.random()
                *
                .35
            )
            +
            "s";


        document.body.appendChild(
            sparkle
        );


        setTimeout(
            function () {

                sparkle.remove();

            },

            2000
        );

    }

}


/* =====================================================
   PURPLE HEARTS
===================================================== */

function makeHearts() {


    const rect =
        stella.getBoundingClientRect();


    for (
        let i = 0;
        i < 5;
        i++
    ) {


        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "stella-heart";


        heart.textContent =
            "💜";


        heart.style.left =
            (
                rect.left
                +
                rect.width / 2
            )
            +
            "px";


        heart.style.top =
            (
                rect.top
                +
                rect.height / 2
            )
            +
            "px";


        heart.style.setProperty(

            "--heartX",

            (
                Math.random()
                *
                140
                -
                70
            )
            +
            "px"

        );


        document.body.appendChild(
            heart
        );


        setTimeout(
            function () {

                heart.remove();

            },

            1800
        );

    }

}


/* =====================================================
   FALL LEAF BURST AROUND STELLA
===================================================== */

function leafBurst(
    amount
) {


    const symbols = [

        "🍂",
        "🍁",
        "🍃"

    ];


    const rect =
        stella.getBoundingClientRect();


    const centerX =
        rect.left
        +
        rect.width / 2;


    const centerY =
        rect.top
        +
        rect.height / 2;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const leaf =
            document.createElement(
                "span"
            );


        leaf.className =
            "leaf-burst";


        leaf.textContent =
            symbols[
                Math.floor(
                    Math.random()
                    *
                    symbols.length
                )
            ];


        leaf.style.left =
            centerX
            +
            "px";


        leaf.style.top =
            centerY
            +
            "px";


        const x =
            Math.random()
            *
            260
            -
            130;


        const y =
            Math.random()
            *
            220
            -
            150;


        const rotate =
            Math.random()
            *
            720
            -
            360;


        leaf.style.setProperty(

            "--burstX",

            x + "px"

        );


        leaf.style.setProperty(

            "--burstY",

            y + "px"

        );


        leaf.style.setProperty(

            "--burstRotate",

            rotate + "deg"

        );


        leaf.style.animationDelay =
            (
                Math.random()
                *
                .25
            )
            +
            "s";


        document.body.appendChild(
            leaf
        );


        setTimeout(
            function () {

                leaf.remove();

            },

            2200
        );

    }

}


/* =====================================================
   CLICK STELLA
===================================================== */

stella.addEventListener(
    "click",
    function () {


        /* Restart click reaction */

        stella.classList.remove(
            "clicked"
        );


        void stella.offsetWidth;


        stella.classList.add(
            "clicked"
        );


        /* Talk */

        talk();


        /* Fall magic */

        makeSparkles(
            10
        );


        makeHearts();


        leafBurst(
            12
        );

    }
);


/* =====================================================
   STELLA ARRIVES
===================================================== */

window.addEventListener(
    "load",
    function () {


        /*
          Stella's fly-in lasts 3.5 sec.
          Wait until she lands.
        */


        setTimeout(
            function () {


                /* Welcome */

                talk();


                /* Purple/gold magic */

                makeSparkles(
                    12
                );


                /* BIG FALL LANDING BURST */

                leafBurst(
                    20
                );


            },

            3900
        );

    }
);


/* =====================================================
   IDLE STELLA MAGIC
===================================================== */

setInterval(
    function () {


        if (
            stella.complete
            &&
            stella.naturalWidth
            >
            0
        ) {


            makeSparkles(
                4
            );

        }


    },

    9000
);


/* =====================================================
   OCCASIONAL LEAF PUFF
===================================================== */

setInterval(
    function () {


        if (
            stella.complete
            &&
            stella.naturalWidth
            >
            0
        ) {


            leafBurst(
                4
            );

        }


    },

    18000
);


/* =====================================================
   IMAGE ERROR CHECK
===================================================== */

stella.addEventListener(
    "error",
    function () {


        console.error(
            "Stella.PNG failed to load."
        );


        console.error(
            "Expected image:"
        );


        console.error(
            "https://500blueprint.github.io/Stella-fly/Stella.PNG"
        );

    }
);


})();

</script>


</body>
</html>
